# Automatic dependency update pull requests (#217). Security updates arrive as soon as a fix is
# published; other updates are grouped weekly. Each PR still goes through review and the checks.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/apps/web", "/services/docufast-api", "/services/bluetentbc-api"]
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Until after launch (Olamide, 3 Nov 2026): no major-version jumps (Express 5, Tailwind 4, TypeScript 7,
      # Next.js 15 and so on). Each needs planned work. Minor and patch updates still arrive, grouped weekly.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
